services:
  ui:
    container_name: oksana-vpn-ui
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set the Laravel mini app API URL in .env}
        API_URL: ${API_URL:?Set the auth API URL in .env}
    ports:
      - "194.147.215.202:8082:80"
    expose:
      - "80"
    networks:
      - oksana-vpn
    restart: unless-stopped

networks:
  oksana-vpn:
    external: true
    name: oksana-vpn
